name: release

# Publishes moodswapper to PyPI through a Trusted Publisher: no API token anywhere. GitHub's
# OIDC identity proves to PyPI that this workflow, in this repository, is allowed to upload,
# and the action attaches PEP 740 attestations to every file it uploads.
#
# One-time setup on PyPI (Your account -> Publishing -> add a pending publisher):
#   PyPI Project Name  moodswapper
#   Owner              marcelpadilla
#   Repository name    moodswapper
#   Workflow name      release.yml
#   Environment name   pypi
# and on GitHub: Settings -> Environments -> new environment "pypi", with NO required
# reviewers (a pending approval expires silently after 30 days and the release is lost).
# A pending publisher reserves nothing until the first upload; publish soon after adding it.
#
# Then, per release: set __version__ in src/moodswapper/__init__.py to the date (vYY.MM.DD, for
# example 26.09.16), note it in CHANGELOG.md, commit, and push an annotated tag v<version>.
# PEP 440 drops the zero padding, so PyPI shows 26.9.16; the checks below compare versions,
# not strings. Then either
#   * publish a GitHub Release on that tag, or
#   * run this workflow from the Actions tab, or `gh workflow run release.yml`,
# whichever is easier. Both end in the same upload, and both refuse a version that is not
# tagged on the commit being built or that PyPI already has, so the no-click path is as safe
# as the clicked one. Do not do both for one version: the second run fails on the PyPI check.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the tag check below needs the tags, not just this commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the tests
        # A release ships a bundled dataset for every preset mood: a missing one fails here.
        env:
          MOODSWAPPER_RELEASE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pytest
          python -m pytest -q
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine packaging
          python -m build
          python -m twine check --strict dist/*
      - name: Refuse a version that is not tagged here, or that PyPI already has
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, urllib.error, urllib.request
          from importlib.metadata import version
          from packaging.version import Version
          v = version("moodswapper")
          tag = os.environ.get("TAG", "")
          if tag:
              if Version(tag.lstrip("v")) != Version(v):
                  raise SystemExit(f"release tag {tag} does not match moodswapper {v}; tag it v{v}")
          else:
              # Run from the Actions tab or `gh workflow run`: there is no Release to read a tag
              # from, so require that this very commit carries one. Without this a dispatch could
              # put a version on PyPI that no tag points at, and nothing on PyPI would lead back
              # to the commit it was built from.
              here = subprocess.run(["git", "tag", "--points-at", "HEAD"],
                                    capture_output=True, text=True, check=True).stdout.split()
              if not any(Version(t.lstrip("v")) == Version(v) for t in here):
                  raise SystemExit(f"no v{v} tag on this commit (tags here: {' '.join(here) or 'none'}). "
                                   f"Tag it v{v}, push the tag, then run this again.")
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/moodswapper/json", timeout=30) as r:
                  existing = [k for k, files in json.load(r)["releases"].items() if files]
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  print(f"::warning::could not read PyPI metadata ({exc}); skipping the check")
                  sys.exit(0)
              existing = []
          except Exception as exc:
              print(f"::warning::could not reach PyPI ({exc}); skipping the check")
              sys.exit(0)
          if any(Version(e) == Version(v) for e in existing):
              raise SystemExit(f"moodswapper {v} is already on PyPI. Bump __version__ in "
                               f"src/moodswapper/__init__.py and cut a new release.")
          print(f"moodswapper {v} is free to publish")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Separate from the build on purpose: only this job holds the OIDC token, and it never
  # checks out the repository, so nothing in the tree can touch the upload.
  pypi-publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    concurrency:
      group: release-pypi
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
